<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>기업 분석 — 한일 보험 규제 챗봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root{--navy:#0d1b3e;--navy2:#1a2f6b;--gold:#c9a84c;--bg:#f7f8fc;--sur:#fff;--brd:#e4e7ef;--txt:#1a1d2e;--mut:#6b7280;--green:#1b5e20;--green-l:#e8f5e9;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:2px solid var(--gold)}
.logo{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700;cursor:pointer}
.sub{font-size:12px;color:rgba(255,255,255,.5)}
.tabbar{display:flex;background:var(--sur);border-bottom:1px solid var(--brd);padding:0 28px;flex-shrink:0}
.tab{padding:13px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s;text-decoration:none;display:flex;align-items:center}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.tab:hover:not(.active){color:var(--txt)}
.main{flex:1;overflow-y:auto;padding:32px 28px}
.inner{max-width:860px;margin:0 auto}
.search-card{background:var(--sur);border:1px solid var(--brd);border-radius:14px;padding:28px 28px 24px;margin-bottom:24px}
.search-title{font-family:"Noto Serif KR",serif;font-size:20px;font-weight:700;color:var(--navy);margin-bottom:6px}
.search-desc{font-size:13px;color:var(--mut);margin-bottom:20px;line-height:1.6}
.search-row{display:flex;gap:10px;margin-bottom:14px}
.search-row input{flex:1;padding:13px 18px;border:1.5px solid var(--brd);border-radius:10px;font-size:14px;font-family:"Noto Sans KR",sans-serif;outline:none;background:var(--bg);transition:border-color .2s}
.search-row input:focus{border-color:var(--navy2);background:#fff}
.search-row button{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px 24px;font-size:14px;font-weight:600;font-family:"Noto Sans KR",sans-serif;cursor:pointer;transition:background .2s;white-space:nowrap}
.search-row button:hover{background:var(--navy2)}
.search-row button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);cursor:pointer;padding:5px 12px;border:1px solid var(--brd);border-radius:20px;background:var(--bg);transition:background .15s;user-select:none}
.chip input{width:13px;height:13px;cursor:pointer;accent-color:var(--navy)}
.chip:hover{background:#eef1f8}
.result-wrap{display:none}
.result-wrap.show{display:block}
.result-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px}
.result-company{font-family:"Noto Serif KR",serif;font-size:22px;font-weight:700;color:var(--navy)}
.result-meta{font-size:12px;color:var(--mut);margin-top:3px}
.action-btns{display:flex;gap:8px;flex-shrink:0}
.btn-share{padding:8px 16px;font-size:13px;font-weight:600;border:1.5px solid var(--navy);color:var(--navy);background:var(--sur);border-radius:8px;cursor:pointer;font-family:"Noto Sans KR",sans-serif;transition:all .15s}
.btn-share:hover{background:var(--navy);color:#fff}
.btn-pdf{padding:8px 16px;font-size:13px;font-weight:600;border:1.5px solid var(--gold);color:#7a5c10;background:#fffbf0;border-radius:8px;cursor:pointer;font-family:"Noto Sans KR",sans-serif;transition:all .15s}
.btn-pdf:hover{background:var(--gold);color:#fff}
.report-card{background:var(--sur);border:1px solid var(--brd);border-radius:14px;overflow:hidden}
.sec{border-bottom:1px solid var(--brd);padding:22px 28px}
.sec:last-child{border-bottom:none}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sec-label{font-size:15px;font-weight:700;color:var(--txt);letter-spacing:0;margin-bottom:2px}
.sec-body{font-size:14px;line-height:1.85;color:#374151}
.sec-body ul{padding-left:0;list-style:none}
.sec-body li{padding:4px 0 4px 18px;position:relative;margin-bottom:3px}
.sec-body li::before{content:"\u2022";position:absolute;left:0;color:var(--navy);font-weight:700}
.sec-body strong{font-weight:600;color:var(--txt)}
.sec-body p{margin-bottom:6px}
.sec-body table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.sec-body th{background:#f4f5f9;padding:8px 12px;text-align:left;border:1px solid var(--brd);font-weight:600}
.sec-body td{padding:7px 12px;border:1px solid var(--brd)}
.sec-body tr:nth-child(even) td{background:#fafbff}
.sec-note{font-size:12px;color:var(--mut);padding:14px 28px;background:#fafbff;border-top:1px solid var(--brd)}
.loading-card{background:var(--sur);border:1px solid var(--brd);border-radius:14px;padding:40px 28px;text-align:center}
.loading-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.loading-dots span{width:9px;height:9px;background:#bbb;border-radius:50%;animation:bounce 1.2s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.loading-txt{font-size:14px;color:var(--mut)}
.loading-elapsed{font-size:12px;color:var(--mut);margin-top:6px;opacity:.7}
.error-card{background:#fff5f5;border:1px solid #feb2b2;border-radius:14px;padding:28px;text-align:center;margin-bottom:16px}
.error-card .err-icon{font-size:28px;margin-bottom:10px}
.error-card .err-title{font-size:15px;font-weight:600;color:#c53030;margin-bottom:6px}
.error-card .err-msg{font-size:13px;color:#742a2a;line-height:1.6}
.error-card .err-retry{margin-top:14px;padding:8px 20px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:"Noto Sans KR",sans-serif;cursor:pointer}
.error-card .err-retry:hover{background:var(--navy2)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.share-banner{background:var(--green-l);border:1px solid #a5d6a7;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:none;align-items:center;gap:10px}
.share-banner.show{display:flex}
.share-banner span{font-size:13px;color:var(--green);flex:1}
.share-banner button{font-size:12px;padding:5px 14px;border:1px solid var(--green);color:var(--green);background:transparent;border-radius:6px;cursor:pointer;font-family:"Noto Sans KR",sans-serif;font-weight:600;white-space:nowrap}
.share-banner button:hover{background:var(--green);color:#fff}
@media print{header,.tabbar,.search-card,.action-btns,.share-banner,.toast{display:none!important}body{overflow:visible!important;height:auto!important}.main{overflow:visible!important;padding:0!important}.result-wrap{display:block!important}.report-card{border:none!important}.sec{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo" onclick="location.href='index.html'">한일 보험 규제 챗봇</div>
    <div class="sub">Habitfactory x Signal Financial Lab</div>
  </div>
  <div style="font-size:12px;color:rgba(255,255,255,.4)">기업 분석 리서치</div>
</header>
<div class="tabbar">
  <a class="tab" href="index.html">&#127968; 홈</a>
  <a class="tab" href="index.html#chat">&#128172; AI 챗봇</a>
  <a class="tab" href="index.html#laws">&#128218; 법령 조회</a>
  <a class="tab active" href="company.html">&#127970; 기업 분석</a>
</div>
<div class="main">
<div class="inner">
  <div class="share-banner" id="shareBanner">
    <span id="shareBannerTxt">공유된 분석 결과입니다.</span>
    <button onclick="document.getElementById('shareBanner').classList.remove('show')">닫기</button>
  </div>
  <div class="search-card">
    <div class="search-title">&#127970; 기업 분석 리서치</div>
    <div class="search-desc">기업명·서비스명·브랜드명을 입력하면 AI가 웹 검색으로 최신 정보를 수집해 한국어 보고서로 정리합니다.<br>예: <em>東京海上ホールディングス</em> / <em>삼성화재</em> / <em>Zurich Insurance</em> / <em>じぶんの保険</em></div>
    <div class="search-row">
      <input type="text" id="qinput" placeholder="기업명 또는 서비스명 입력..." onkeydown="if(event.key==='Enter')doSearch()"/>
      <button id="sbtn" onclick="doSearch()">분석 시작</button>
    </div>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="opt_overview" checked> 기본 정보·연혁</label>
      <label class="chip"><input type="checkbox" id="opt_business" checked> 사업 현황</label>
      <label class="chip"><input type="checkbox" id="opt_strategy" checked> 추진 전략</label>
      <label class="chip"><input type="checkbox" id="opt_finance" checked> 재무 정보</label>
      <label class="chip"><input type="checkbox" id="opt_insurance" checked> 보험업 특화</label>
      <label class="chip"><input type="checkbox" id="opt_news"> 최근 뉴스</label>
    </div>
  </div>
  <div id="errorEl" style="display:none"></div>
  <div id="loadingEl" style="display:none">
    <div class="loading-card">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      <div class="loading-txt" id="loadingTxt">웹 검색 및 분석 중...</div>
      <div class="loading-elapsed" id="loadingElapsed"></div>
    </div>
  </div>
  <div class="result-wrap" id="resultWrap">
    <div class="result-header">
      <div>
        <div class="result-company" id="resultCompany"></div>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <div class="action-btns">
        <button class="btn-share" onclick="shareURL()">&#128279; URL 공유</button>
        <button class="btn-pdf" onclick="printWithName()">&#128196; PDF 저장</button>
      </div>
    </div>
    <div class="report-card" id="reportCard"></div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var API="https://japan-insurance-law-chatbot.vercel.app/api/company";
var currentQuery="";
function getOpts(){
  return{
    overview:document.getElementById("opt_overview").checked,
    business:document.getElementById("opt_business").checked,
    strategy:document.getElementById("opt_strategy").checked,
    finance:document.getElementById("opt_finance").checked,
    insurance:document.getElementById("opt_insurance").checked,
    news:document.getElementById("opt_news").checked
  };
}
function doSearch(){
  var q=document.getElementById("qinput").value.trim();
  if(!q){showToast("기업명 또는 서비스명을 입력해 주세요.");return;}
  currentQuery=q;
  runSearch(q,getOpts());
}
function showError(msg,retryQuery){
  document.getElementById("errorEl").style.display="block";
  document.getElementById("errorEl").innerHTML=
    '<div class="error-card">'+
    '<div class="err-icon">⚠️</div>'+
    '<div class="err-title">분석 중 오류가 발생했습니다</div>'+
    '<div class="err-msg">'+msg+'</div>'+
    '<button class="err-retry" onclick="document.getElementById(\'errorEl\').style.display=\'none\';runSearch(\''+retryQuery+'\',getOpts())">다시 시도</button>'+
    '</div>';
}
function runSearch(query,opts){
  document.getElementById("sbtn").disabled=true;
  document.getElementById("resultWrap").classList.remove("show");
  document.getElementById("errorEl").style.display="none";
  document.getElementById("loadingEl").style.display="block";
  var msgs=["웹 검색 중...","최신 정보 수집 중...","보고서 작성 중..."];
  var mi=0;
  var elapsed=0;
  var iv=setInterval(function(){
    mi=(mi+1)%msgs.length;
    elapsed+=2;
    document.getElementById("loadingTxt").textContent=msgs[mi];
    document.getElementById("loadingElapsed").textContent=elapsed+"초 경과 중...";
  },2000);
  fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:query,options:opts})})
  .then(function(r){return r.json();})
  .then(function(data){
    clearInterval(iv);
    document.getElementById("loadingEl").style.display="none";
    document.getElementById("loadingElapsed").textContent="";
    document.getElementById("sbtn").disabled=false;
    if(data.error){
      var msg=data.error;
      if(msg.indexOf("rate limit")>=0||msg.indexOf("rate_limit")>=0){
        msg="API 사용량 한도에 도달했습니다. 잠시 후(1~2분) 다시 시도해 주세요.";
      } else if(msg.indexOf("api_key")>=0||msg.indexOf("API_KEY")>=0){
        msg="API 인증 오류입니다. 관리자에게 문의해 주세요.";
      }
      showError(msg,query);
      return;
    }
    renderReport(query,data.text||"");
  })
  .catch(function(e){
    clearInterval(iv);
    document.getElementById("loadingEl").style.display="none";
    document.getElementById("loadingElapsed").textContent="";
    document.getElementById("sbtn").disabled=false;
    showError("네트워크 오류: "+e.message,query);
  });
}
var SEC_COLORS=["#1a2f6b","#1b5e20","#7b1fa2","#b45309","#c62828","#0277bd"];
function renderReport(query,text){
  document.getElementById("resultCompany").textContent=query;
  document.getElementById("resultMeta").textContent="기업 분석 보고서 · "+new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})+" 기준 · AI 웹검색 기반";
  var parts=text.split(/\n(?=## )/);
  var html="";
  var noteText="";
  parts.forEach(function(part){
    var m=part.match(/^## ([^\n]+)\n([\s\S]*)/);
    if(!m){if(part.trim())noteText=part.trim();return;}
    var title=m[1].trim();
    var body=m[2].trim();
    var noteMatch=body.match(/\n\*\*\[정보 출처[^\]]*\][\s\S]*$/m);
    if(noteMatch){noteText=noteMatch[0].replace(/^\n/,"").trim();body=body.replace(noteMatch[0],"").trim();}
    var num=title.match(/^(\d+)\./);
    var col=num?(SEC_COLORS[parseInt(num[1])-1]||"#0d1b3e"):"#0d1b3e";
    html+='<div class="sec"><div class="sec-hd"><div class="sec-dot" style="background:'+col+'"></div><div class="sec-label">'+esc(title)+'</div></div><div class="sec-body">'+marked.parse(body)+'</div></div>';
  });
  if(noteText)html+='<div class="sec-note">'+esc(noteText.replace(/^\*+|\*+$/g,""))+'</div>';
  document.getElementById("reportCard").innerHTML=html||'<div class="sec"><div class="sec-body"><p>분석 결과를 불러오지 못했습니다.</p></div></div>';
  document.getElementById("resultWrap").classList.add("show");
  document.getElementById("resultWrap").scrollIntoView({behavior:"smooth",block:"start"});
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function shareURL(){
  var url=location.origin+location.pathname+"?q="+encodeURIComponent(currentQuery);
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){showToast("URL이 클립보드에 복사됐습니다!");});}
  else{prompt("아래 URL을 복사하세요:",url);}
}
function printWithName(){var d=new Date();var ds=d.getFullYear()+"."+(("0"+(d.getMonth()+1)).slice(-2))+"."+(("0"+d.getDate()).slice(-2));var co=document.getElementById("resultCompany").textContent||"기업";var prev=document.title;document.title=ds+"_"+co+"_기업분석_한일보험규제챗봇";window.print();setTimeout(function(){document.title=prev;},2000);}
function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2500);
}
(function(){
  var p=new URLSearchParams(location.search);
  var q=p.get("q");
  if(q){
    document.getElementById("qinput").value=q;
    currentQuery=q;
    document.getElementById("shareBannerTxt").textContent='"'+q+'" 분석 결과 — 공유된 링크입니다.';
    document.getElementById("shareBanner").classList.add("show");
    runSearch(q,getOpts());
  }
})();
</script>
</body>
          </html>
